
name: Render Medical Reel

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npm run render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: medical-reel
          path: out/medical-reel.mp4
